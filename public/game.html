<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D MMO Game - BETA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="info-panel">
            <h1>2D MMO Game</h1>
            <div id="player-info">
                <p>Players Online: <span id="player-count">0</span></p>
                <p>Your Position: <span id="position">X: 0, Y: 0</span></p>
            </div>
            <div id="controls">
                <h3>Controls:</h3>
                <p>WASD or Arrow Keys - Move</p>
                <p>Mouse - Look around (camera follows player)</p>
            </div>
            <button id="backToHomeBtn" style="margin-top: 15px; padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">Back to Home</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
